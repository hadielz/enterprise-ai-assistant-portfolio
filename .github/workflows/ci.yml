name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  # Allows manually running the workflow from the GitHub Actions UI.
  workflow_dispatch:

permissions:
  contents: read

# Cancel older runs for the same branch when newer commits are pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================================
  # Backend Job
  # - Starts a temporary PostgreSQL service
  # - Applies Alembic migrations
  # - Runs the complete pytest suite
  # - Runs the deterministic AI-quality gate
  # - Uploads the machine-readable AI-quality report
  # ==========================================================
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17

        env:
          POSTGRES_DB: enterprise_ai_test
          POSTGRES_USER: enterprise_ai_test
          POSTGRES_PASSWORD: enterprise_ai_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd
          "pg_isready -U enterprise_ai_test -d enterprise_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Supports both import styles currently used in the project.
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend

      # Temporary CI database (NOT the development database).
      DATABASE_URL: >-
        postgresql+psycopg://enterprise_ai_test:enterprise_ai_test@localhost:5432/enterprise_ai_test

      TEST_DATABASE_URL: >-
        postgresql+psycopg://enterprise_ai_test:enterprise_ai_test@localhost:5432/enterprise_ai_test

      # Test-only JWT configuration.
      JWT_SECRET_KEY: github-actions-test-secret-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"

      # Prevent CI from contacting real LLM providers.
      LLM_PROVIDER: mock
      LLM_FALLBACK_PROVIDERS: mock

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Backend quality check
        run: ruff check backend/app evals tests

      - name: Python dependency vulnerability audit
        run: >
          pip-audit -r backend/requirements.txt --strict --progress-spinner off
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815

      - name: Public repository guard
        run: python scripts/security/repository_guard.py

      - name: Apply Alembic migrations
        working-directory: backend
        run: alembic -c alembic.ini upgrade head

      - name: Show active Alembic revision
        working-directory: backend
        run: alembic -c alembic.ini current

      - name: Run backend test suite
        run: pytest -v

      # Run the deterministic offline AI regression suite using the same
      # dependency-complete environment as the backend tests. The evaluator
      # owns pass/fail semantics, including required active cases and reserved
      # cases, so CI does not duplicate evaluation policy in YAML.
      - name: AI quality gate
        run: >-
          python -m evals.runner
          --experiment-name ci-ai-quality-gate
          --output evals/results/ci-ai-quality-report.json

      # Keep the machine-readable report available for diagnosis on both
      # successful and failed evaluation runs. `always()` lets this step run
      # after a quality-gate failure without changing the evaluator's original
      # non-zero job result. Configuration errors may occur before a report is
      # created, so a missing file is intentionally ignored here.
      - name: Upload AI quality report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-quality-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: evals/results/ci-ai-quality-report.json
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================================
  # Frontend Job
  # - Installs frontend dependencies
  # - Builds the production React/Vite bundle
  # ==========================================================
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint React frontend
        run: npm run lint

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build React frontend
        run: npm run build

  # ==========================================================
  # Docker Job
  # Runs only after backend and frontend succeed.
  # Verifies that the production Docker images can be built.
  # ==========================================================
  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - backend
      - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build backend Docker image
        run: docker build --tag enterprise-ai-assistant:ci .

      - name: Build frontend Docker image
        run: docker build --tag enterprise-ai-frontend:ci frontend